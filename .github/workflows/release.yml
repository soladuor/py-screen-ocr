name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # 用法参考 https://docs.github.com/zh/actions/tutorials/authenticate-with-github_token
    # 权限参考 https://docs.github.com/zh/actions/reference/workflows-and-actions/workflow-syntax#permissions
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.18.0

      - name: Build exe
        run: pyinstaller --onefile --noconsole --name screen-ocr src/main.py

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/screen-ocr.exe
          body_path: docs/RELEASE_NOTES.md
